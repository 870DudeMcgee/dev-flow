name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        run: pip install -e ".[test]"

      - name: Run release readiness checks
        run: ./scripts/release-check.sh

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke install wheel
        run: |
          python -m venv /tmp/devflow-smoke
          /tmp/devflow-smoke/bin/python -m pip install dist/*.whl
          /tmp/devflow-smoke/bin/devflow --help
          /tmp/devflow-smoke/bin/devflow status --help
          /tmp/devflow-smoke/bin/devflow loop --help
          /tmp/devflow-smoke/bin/devflow loop spine-fixture --target-file src/devflow/loop/models.py --json
