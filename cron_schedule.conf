# Brief Intelligence Cron Schedule
# Add this to your Hermes cron or system crontab:
#
# Daily run at 9:00 AM UTC:
# hermes cron add --schedule "0 9 * * *" --prompt "Run brief_intelligence: cd ~/Local\ AI\ Dev\ Team && PYTHONPATH=src python -m brief_intelligence.main --reference Reference --out Obsidian/Brief.md --queue BrainstormQueue.md --daily"
#
# Backfill (one-time, process all existing briefs):
# hermes cron add --schedule "once" --prompt "Run brief_intelligence backfill: cd ~/Local\ AI\ Dev\ Team && PYTHONPATH=src python -m brief_intelligence.main --reference Reference --out Obsidian/Brief.md --queue BrainstormQueue.md --backfill"
#
# Or using the mode flag:
# python -m brief_intelligence.main --reference Reference --out Obsidian/Brief.md --queue BrainstormQueue.md --mode daily
# python -m brief_intelligence.main --reference Reference --out Obsidian/Brief.md --queue BrainstormQueue.md --mode backfill
