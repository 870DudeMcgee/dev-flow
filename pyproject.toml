[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "0.1.0"
description = "A local operating layer for turning ideas into verified product implementations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["ai", "cli", "developer-tools", "orchestration", "workflow"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Topic :: Software Development",
]
dependencies = [
	"pydantic>=2.13",
	"PyYAML>=6.0",
	"typer>=0.26",
]

[project.urls]
Homepage = "https://github.com/870DudeMcgee/dev-flow"
Repository = "https://github.com/870DudeMcgee/dev-flow"
Documentation = "https://github.com/870DudeMcgee/dev-flow#readme"
Issues = "https://github.com/870DudeMcgee/dev-flow/issues"

[project.optional-dependencies]
# Quarantined experimental harness; not active first-pass model validation.
hyperplane = [
	"hyperplane-eval>=0.1.14,<0.2",
]
test = [
	"pytest>=8.0",
	"pytest-xdist>=3.5",
	"pytest-timeout>=2.3",
	"ruff>=0.6,<1",
]
dev = [
	"pytest>=8.0",
	"pytest-xdist>=3.5",
	"pytest-timeout>=2.3",
	"ruff>=0.6,<1",
]

[project.scripts]
devflow = "devflow.cli:main"
df = "devflow.cli:df_main"
ornith = "devflow.cli:ornith_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devflow.control_room" = ["static/*"]

[tool.ruff]
# Lint the source and tests; the editable-install venv and generated dirs are noise.
src = ["src"]
extend-exclude = [".venv", "build", "dist", "graphify-out", "scratch"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Scoped to rules that catch real bugs, not opinionated style. Pyflakes (F)
# finds unused imports/vars, repeated dict keys, and redefinitions; the pycodestyle
# error subset (E4/E7) catches import and comparison mistakes.
select = ["F", "E4", "E7", "E9", "W6"]
# E402 (import-not-at-top): DevFlow deliberately uses lazy in-function imports for
# CLI startup speed, so this rule fights the architecture. Excluded by design.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Test files and __init__.py re-exports legitimately keep "unused" names.
"tests/**" = ["F841"]
"**/__init__.py" = ["F401"]
# service.py is a deliberate facade: it re-exports task/persistence/promotion
# helpers (e.g. get_task is imported via service in ~25 modules). The imports
# look "unused" locally but are the module's whole purpose. Do NOT auto-fix.
"src/devflow/control_room/service.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
	"slow: tests that exercise end-to-end CLI or real subprocess timeouts (deselect with -m 'not slow')",
	"ui_browser: Playwright browser UI tests (auto-deselect when Playwright is not installed)",
	"ui_browser_live: Live local-model browser signoff tests",
]
