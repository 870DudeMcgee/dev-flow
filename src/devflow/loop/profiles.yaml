# DevFlow Deployment Profiles
#
# Profiles describe environments, not architectures. They influence routing
# by providing per-role model preferences. They do NOT modify pipeline logic.
#
# A profile entry for a role says: "in this environment, prefer this model
# for this role." The routing layer still verifies that the model satisfies
# the role's required capabilities before assigning it.
#
# Profile precedence (highest to lowest):
#   1. Explicit opt-in local-audition override
#   2. Capability-checked per-run override
#   3. Active deployment profile (below)
#   4. Role policy (roles.py preferred cost classes / transports)
#   5. Automatic routing (cheapest eligible registered model)
#
# Profiles are assignment templates, not machine detection and not fixed
# architectures. Model eligibility comes from models.yaml (or the host-specific
# DEVFLOW_MODELS_YAML override). A profile may name a model that is unavailable
# on the current host; routing then falls through to another qualified model.

profiles:
  # -----------------------------------------------------------------
  # Legacy-current: preserve the historical M4 mixed assignment template.
  # This remains the default profile for compatibility, but host registry
  # eligibility still controls whether its preferred models can be selected.
  # -----------------------------------------------------------------
  legacy-current:
    description: "Compatibility default preserving the historical M4 mixed assignment template; actual eligibility is host-registry dependent."
    roles:
      planner: "agents-a1-q4"
      planning_judge: "qwen-27b-q5km"
      builder: "ornith-35b"
      build_judge: "qwen-27b-q5km"
      verifier: "glm-5.2"
      final_judge: "glm-5.2"
      brainstorm: "glm-5.2"

  # -----------------------------------------------------------------
  # Studio-local-heavy: large local models available.
  # Prefer local planning, building, and judging. Use frontier
  # reasoning only where it provides significant value.
  # -----------------------------------------------------------------
  studio-local-heavy:
    description: "Mac Studio with local fleet. Prefer local execution."
    roles:
      planner: "agents-a1-q4"
      planning_judge: "qwen-27b-q5km"
      builder: "ornith-35b"
      build_judge: "qwen-27b-q5km"
      verifier: "qwen-27b-q5km"
      final_judge: "glm-5.2"
      brainstorm: "glm-5.2"

  # -----------------------------------------------------------------
  # Mini-free-cloud: minimal local compute.
  # Prefer free cloud workers. Reserve subscription models for
  # high-value reasoning only.
  # -----------------------------------------------------------------
  mini-free-cloud:
    description: "Mac mini fast path. Use the zero-cost HY3 cloud worker for all text roles."
    roles:
      planner: "hy3-free"
      planning_judge: "hy3-free"
      builder: "hy3-free"
      build_judge: "hy3-free"
      verifier: "hy3-free"
      final_judge: "hy3-free"
      brainstorm: "hy3-free"

  # -----------------------------------------------------------------
  # Cloud-free-fast: cloud-only, zero-incremental-cost dogfood fleet.
  # Ordered OpenRouter :free fleets keep HY3-first planning and building plus
  # independent review cloud-only while preserving disjoint builder/judge sets.
  # -----------------------------------------------------------------
  cloud-free-fast:
    description: "Cloud-only zero-cost path with HY3-first reasoning and code plus an independent review fleet."
    roles:
      planner: "free-fast-reasoning-fleet"
      planning_judge: "free-review-fleet"
      builder: "free-code-fleet"
      build_judge: "free-review-fleet"
      verifier: "free-review-fleet"
      final_judge: "free-review-fleet"
      brainstorm: "free-fast-reasoning-fleet"

  # -----------------------------------------------------------------
  # Mini-Ollama: legacy-named Mini mixed profile; it no longer uses Ollama.
  # Its assignments differ from mini-baseline, so it is not a true alias.
  # -----------------------------------------------------------------
  mini-ollama:
    description: "Legacy-named Mac mini mixed route; local builder plus subscription reasoning. Does not use Ollama and is not equivalent to mini-baseline."
    roles:
      planner: "gpt-5.6-terra"
      planning_judge: "gpt-5.6-luna"
      builder: "qwen2.5-coder-7b-mini"
      build_judge: "gpt-5.6-luna"
      verifier: "gpt-5.6-luna"
      final_judge: "gpt-5.6-terra"
      brainstorm: "gpt-5.6-terra"

  # -----------------------------------------------------------------
  # Mini-baseline: Mac Mini M1 (16GB) with proven llama.cpp fleet.
  # Local builder/scout/review via single-flight port 8088.
  # Subscription models for planning, judging, and verification.
  # -----------------------------------------------------------------
  mini-baseline:
    description: "Mac Mini M1 llama.cpp fleet. Local builder+scout, subscription reasoning."
    roles:
      planner: "gpt-5.6-terra"
      planning_judge: "gpt-5.6-luna"
      builder: "qwen2.5-coder-7b-mini"
      build_judge: "ornith-9b-mini"
      verifier: "gpt-5.6-luna"
      final_judge: "gpt-5.6-sol"
      brainstorm: "glm-5.2"

  # -----------------------------------------------------------------
  # Mini Laguna builder audition: baseline reasoning fleet with Laguna
  # replacing only the bounded implementation worker.
  # -----------------------------------------------------------------
  mini-laguna-builder:
    description: "Mac Mini audition profile. Laguna M.1 free builds; baseline models retain every other role."
    roles:
      planner: "gpt-5.6-terra"
      planning_judge: "gpt-5.6-luna"
      builder: "laguna-m1-free"
      build_judge: "ornith-9b-mini"
      verifier: "gpt-5.6-luna"
      final_judge: "gpt-5.6-sol"
      brainstorm: "glm-5.2"

  # -----------------------------------------------------------------
  # Custom: operator assigns every role manually via overrides.
  # This profile leaves everything unset — all roles resolve through
  # automatic routing (cheapest eligible model).
  # -----------------------------------------------------------------
  custom:
    description: "All roles resolved through automatic routing."
    roles: {}

  # -----------------------------------------------------------------
  # HY3 swap: all local model roles replaced by Hy3 free cloud worker.
  # Tests routing through OpenRouter :free tier for every pipeline role.
  # -----------------------------------------------------------------
  hy3-swap:
    description: "All local roles replaced by Hy3 free cloud worker via OpenRouter."
    roles:
      planner: "hy3-free"
      planning_judge: "hy3-free"
      builder: "hy3-free"
      build_judge: "hy3-free"
      verifier: "hy3-free"
      final_judge: "hy3-free"
      brainstorm: "hy3-free"

  # -----------------------------------------------------------------
  # GPT swap: GLM-5.2 roles replaced by GPT-5.6 family.
  # Terra handles brainstorm; Luna handles verifier + final_judge.
  # -----------------------------------------------------------------
  gpt-swap:
    description: "GLM-5.2 roles replaced: Terra=brainstorm, Luna=verifier+final_judge."
    roles:
      planner: "agents-a1-q4"
      planning_judge: "qwen-27b-q5km"
      builder: "ornith-35b"
      build_judge: "qwen-27b-q5km"
      verifier: "gpt-5.6-luna"
      final_judge: "gpt-5.6-luna"
      brainstorm: "gpt-5.6-terra"
