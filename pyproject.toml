[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "0.1.0"
description = "A safe, file-based unified-diff task runner for AI development workflows."
readme = "docs/agent-handoff.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devflow = "devflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devflow = ["schemas/*.json"]
